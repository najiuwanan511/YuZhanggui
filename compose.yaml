name: yuzhanggui

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-yuzhanggui}
      MYSQL_USER: ${DB_USERNAME:-yuzhanggui}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=100
    volumes:
      - mysql-data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - yuzhanggui

  app:
    build:
      context: .
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    image: ${APP_IMAGE:-yuzhanggui:latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-yuzhanggui}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
      DB_USERNAME: ${DB_USERNAME:-yuzhanggui}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:12400}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
      UPDATE_GITHUB_REPOSITORY: ${UPDATE_GITHUB_REPOSITORY:-najiuwanan511/YuZhanggui}
      UPDATE_RELEASE_API: ${UPDATE_RELEASE_API:-https://api.github.com/repos/najiuwanan511/YuZhanggui/releases/latest}
      UPDATE_REQUEST_DIR: /app/update
      UPDATE_CHECK_CACHE_MINUTES: ${UPDATE_CHECK_CACHE_MINUTES:-60}
      CAPTCHA_BROWSER_ENABLED: ${CAPTCHA_BROWSER_ENABLED:-true}
      # 容器无显示器，验证失败时通过手动 Cookie 更新兜底；桌面部署请设为 false。
      CAPTCHA_BROWSER_HEADLESS: ${CAPTCHA_BROWSER_HEADLESS:-true}
      CAPTCHA_BROWSER_TIMEOUT_SECONDS: ${CAPTCHA_BROWSER_TIMEOUT_SECONDS:-120}
      CAPTCHA_BROWSER_MAX_CONCURRENT: ${CAPTCHA_BROWSER_MAX_CONCURRENT:-1}
      CAPTCHA_BROWSER_REMOTE_ENABLED: ${CAPTCHA_BROWSER_REMOTE_ENABLED:-false}
      CAPTCHA_BROWSER_REMOTE_PORT: ${CAPTCHA_BROWSER_REMOTE_PORT:-7900}
      CAPTCHA_BROWSER_REMOTE_URL: ${CAPTCHA_BROWSER_REMOTE_URL:-}
      CAPTCHA_BROWSER_VNC_PASSWORD: ${CAPTCHA_BROWSER_VNC_PASSWORD:-change-me}
      CAPTCHA_BROWSER_PROFILE_DIR: ${CAPTCHA_BROWSER_PROFILE_DIR:-./data/browser-profiles}
      WEBSOCKET_CREDENTIAL_KEEP_ALIVE_ENABLED: ${WEBSOCKET_CREDENTIAL_KEEP_ALIVE_ENABLED:-false}
      WEBSOCKET_CREDENTIAL_REFRESH_MIN_MINUTES: ${WEBSOCKET_CREDENTIAL_REFRESH_MIN_MINUTES:-120}
      WEBSOCKET_CREDENTIAL_REFRESH_MAX_MINUTES: ${WEBSOCKET_CREDENTIAL_REFRESH_MAX_MINUTES:-240}
      WEBSOCKET_TOKEN_REFRESH_SCAN_ENABLED: ${WEBSOCKET_TOKEN_REFRESH_SCAN_ENABLED:-false}
      WEBSOCKET_AUTOMATIC_REPAIR_ENABLED: ${WEBSOCKET_AUTOMATIC_REPAIR_ENABLED:-true}
      WEBSOCKET_AUTOMATIC_REPAIR_MIN_HOURS: ${WEBSOCKET_AUTOMATIC_REPAIR_MIN_HOURS:-2}
      WEBSOCKET_AUTOMATIC_REPAIR_MAX_HOURS: ${WEBSOCKET_AUTOMATIC_REPAIR_MAX_HOURS:-4}
      WEBSOCKET_AUTOMATIC_REPAIR_ACCOUNT_SPACING_MINUTES: ${WEBSOCKET_AUTOMATIC_REPAIR_ACCOUNT_SPACING_MINUTES:-15}
      WEBSOCKET_SCHEDULER_POOL_SIZE: ${WEBSOCKET_SCHEDULER_POOL_SIZE:-16}
      WEBSOCKET_RECONNECT_DELAY_SECONDS: ${WEBSOCKET_RECONNECT_DELAY_SECONDS:-15}
      WEBSOCKET_MAX_RECONNECT_DELAY_SECONDS: ${WEBSOCKET_MAX_RECONNECT_DELAY_SECONDS:-300}
      WEBSOCKET_MAX_RECONNECT_ATTEMPTS: ${WEBSOCKET_MAX_RECONNECT_ATTEMPTS:-5}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
    ports:
      - "12400:12400"
      - "${CAPTCHA_BROWSER_REMOTE_BIND:-0.0.0.0}:${CAPTCHA_BROWSER_REMOTE_PORT:-7900}:${CAPTCHA_BROWSER_REMOTE_PORT:-7900}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - ${UPDATE_HOST_DIR:-./runtime/update}:/app/update
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:12400/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - yuzhanggui

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - yuzhanggui

volumes:
  mysql-data:
    name: ${MYSQL_DATA_VOLUME:-yuzhanggui-mysql-data}
  app-data:
    name: ${APP_DATA_VOLUME:-yuzhanggui-app-data}
  app-logs:
    name: ${APP_LOGS_VOLUME:-yuzhanggui-app-logs}

networks:
  yuzhanggui:
    name: ${APP_NETWORK_NAME:-yuzhanggui}
    driver: bridge
